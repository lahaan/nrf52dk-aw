#GENERAL SETTINGS
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y #only 52dk
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_GPIO=y

#WDT
CONFIG_WATCHDOG=y

#MEM
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1024

#SLEEPSTATE/EFFICIENCY
CONFIG_PM_DEVICE=y          #DEVICE SUSPEND
CONFIG_POWEROFF=y           #ENABLE DEEPSLEEP
CONFIG_GPIO_NRFX=y          #PIN SENSE
CONFIG_PM_DEVICE_RUNTIME=y  #SUSPEND IDLE DEVICE
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y