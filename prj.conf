#NCS 3.1.0 - Core PM is automatic (WFI), System OFF manual; CONFIG_PM does NOT work w/ 52832 nor officially supported/needed
CONFIG_PM_DEVICE=y # Enable device runtime PM (for peripherals)
CONFIG_PM_DEVICE_RUNTIME=y # Runtime PM for UART, etc
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n # You're using runtime PM, not system-managed

#UART - SERIAL must be enabled (ASYNC, INTERRUPT are dependent on it)
CONFIG_SERIAL=y # Required base
CONFIG_UART_ASYNC_API=y # Non-blocking, allows WFI
CONFIG_UART_INTERRUPT_DRIVEN=n # Disable to avoid wake spam

#Watchdog; NRFX might be unnecessary?
CONFIG_NRFX_WDT0=y
CONFIG_WATCHDOG=y

#RTT (sleep-safe debug) but SERIAL might cause issues still
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y # can be removed if causes issues

#GPIO wake (no special config needed - it's automatic)
CONFIG_GPIO=y

CONFIG_UART_CONSOLE=n

