# NCS 3.1.0 - Core PM is automatic (WFI), System OFF manual
CONFIG_PM_DEVICE=y              # Enable device runtime PM (for peripherals)
CONFIG_PM_DEVICE_RUNTIME=y      # Runtime PM for UART, etc
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n  # You're using runtime PM, not system-managed

# UART - SERIAL must be enabled, but we use async (sleep-friendly)
CONFIG_SERIAL=y                 # Required base
CONFIG_UART_ASYNC_API=y         # Non-blocking, allows WFI
CONFIG_UART_INTERRUPT_DRIVEN=n  # Disable to avoid wake spam

# Watchdog - nrfx is correct
CONFIG_NRFX_WDT0=y
CONFIG_WATCHDOG=y

# RTT (sleep-safe debug)
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y       # Reduces RTT traffic (optional)

# GPIO wake (no special config needed - it's automatic)
CONFIG_GPIO=y

